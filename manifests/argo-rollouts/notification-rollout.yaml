apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: notification-service-rollout
  namespace: production
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: mofwili/notification-service:1.0.0
        ports:
        - containerPort: 8082
  strategy:
    canary:
      steps:
        - setWeight: 20
        - pause: {duration: 10s}
        - setWeight: 50
        - pause: {duration: 10s}
        - setWeight: 100
