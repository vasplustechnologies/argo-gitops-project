apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: dockerhub-sensor
  namespace: argo-events
spec:
  dependencies:
    - name: order-service-dep
      eventSourceName: dockerhub-push
      eventName: dockerhub
  triggers:
    - template:
        name: workflow-trigger
        k8s:
          group: argoproj.io
          version: v1alpha1
          resource: workflows
          operation: create
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: order-service-trigger-
                namespace: argo
              spec:
                workflowTemplateRef:
                  name: microservice-deploy
