apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: microservice-deploy-
  namespace: argo
spec:
  entrypoint: microservices
  templates:
  - name: microservices
    dag:
      tasks:
      - name: deploy-order
        template: deploy-order
      - name: deploy-notification
        template: deploy-notification
      - name: deploy-inventory
        template: deploy-inventory

  - name: deploy-order
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args: ["kubectl apply -f /manifests/order-service/deployment.yaml && kubectl apply -f /manifests/order-service/service.yaml"]

  - name: deploy-notification
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args: ["kubectl apply -f /manifests/notification-service/deployment.yaml && kubectl apply -f /manifests/notification-service/service.yaml"]

  - name: deploy-inventory
    container:
      image: bitnami/kubectl:latest
      command: [sh, -c]
      args: ["kubectl apply -f /manifests/inventory-service/deployment.yaml && kubectl apply -f /manifests/inventory-service/service.yaml"]
